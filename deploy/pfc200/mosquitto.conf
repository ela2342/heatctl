# heatctl plant broker, WAGO PFC200. See docs/PFC200.md in the heatctl repo.

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/mosquitto.acl

# RETAINED STATE MUST SURVIVE A RESTART. Without this, a container restart
# drops every retained message - including the room temperatures heatctl reads
# on start-up and the Home Assistant discovery configs. Sleeping sensors make
# that worse: the Shelly H&T wakes every 600 s, so a room can be unreadable for
# a full sleep period after a broker bounce and fall back to house-average
# control silently.
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

log_dest stdout

# --- LAN, TLS only ----------------------------------------------------------
# Everything that crosses the network: the Shellys and Home Assistant.
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false

# --- on-box, plaintext ------------------------------------------------------
# Deliberately NOT published to the host. Reachable only from containers on the
# `plc` docker network, which is where heatctl will run - so its credentials
# never cross the LAN and it pays no TLS cost on a single ARM core for traffic
# that never leaves the machine. heatctl has no TLS support in `mqtt_plane.py`
# today; this is why that is acceptable rather than merely convenient.
listener 1883

# --- bridge to Home Assistant ----------------------------------------------
# Separate file because it carries a credential and therefore has different
# permissions from the rest of the config.
include_dir /mosquitto/config/bridge.d
