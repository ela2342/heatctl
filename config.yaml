# heatctl - configuration
# Layer 1: self-sufficient base control. This file is the single source of
# truth for hardware mapping and limits. In 30 years, start reading here.

io:
  # Backend for the WAGO node: "mqtt" (via modbus2mqtt) or "modbus_direct".
  # Both backends expose identical semantics to the control core, so the
  # transport can be swapped without touching control logic.
  #
  # modbus_direct is the ACTIVE choice (changed 2026-07-26). The insurance
  # policy paid out: the available HA modbus2mqtt add-on can only publish one
  # aggregated JSON document per device, never raw per-register values on flat
  # topics, so it cannot satisfy the contract in docs/MODBUS2MQTT.md - read
  # that file before reconsidering. modbus_direct is also the mandatory
  # transport for the planned 100 ms DHW fast loop, so it is needed anyway.
  # The mqtt backend stays in the tree: the abstraction is what makes the
  # transport replaceable, and a future bridge may do this properly.
  backend: modbus_direct

  modbus:                      # used by modbus_direct AND documented for modbus2mqtt setup
    host: 192.0.2.52       # WAGO 750-352, static DHCP lease
    port: 502
    poll_interval_s: 1.0       # 750-463 only refreshes ~1 Hz anyway
    timeout_s: 2.0             # also bounds each reconnect attempt
    reconnect_delay_s: 1.0     # first retry delay after a lost connection
    reconnect_delay_max_s: 30  # exponential backoff ceiling
    # Read the outputs back each cycle (FC3 at 0x0200 + word) and compare
    # against what we commanded. `valves_pct` is only the last COMMAND, so
    # without this heatctl cannot tell that the coupler's watchdog forced the
    # outputs to their safe state - the per-cycle write heals it in a second
    # and nothing ever records that it happened. Auto-disables itself if the
    # mirror is not readable, so it is safe to leave on.
    valve_readback: true
    valve_readback_tolerance_pct: 2.0
    # Coupler Modbus watchdog - see docs/HARDWARE.md for the register map and
    # the manual references. Type "Standard" with a WRITE-ONLY coding mask, so
    # only real output writes retrigger it: a satisfied watchdog then means
    # "outputs are being driven", not just "something is polling". heatctl's
    # per-cycle valve write is therefore the heartbeat - no separate kick.
    # On time-out the coupler zeroes the physical outputs; with NC actuators
    # that closes the valves, which is the right direction for a DEAD
    # controller (see the failure-policy docstring in heatctl/safety.py).
    # NOTE arming needs no coupler reset, and heatctl clears a trip itself -
    # without that recovery one transient trip would block writes forever.
    watchdog_enabled: true
    watchdog_timeout_s: 10.0
    watchdog_mask: 0x8020      # FC6 (write single) + FC16 (write multiple)

  mqtt_io:                     # used by the mqtt backend
    # Topics produced/consumed by modbus2mqtt. Adjust templates to match
    # your modbus2mqtt configuration; see docs/MODBUS2MQTT.md
    temp_topic: "modbus/wago/temp/{name}"        # payload: raw register value
    valve_topic: "modbus/wago/valve/{name}/set"  # payload: raw 0..32767
    raw_scale: 32767            # 750-559: 32767 = 10 V
    stale_after_s: 10           # per-topic staleness -> sensor treated as failed

mqtt:                          # control-plane broker (telemetry, setpoints, Shellys)
  # CURRENT state: HA's Mosquitto add-on is the broker, because the dedicated
  # machine does not exist yet. TARGET (ROADMAP.md Milestone 4): mosquitto on the
  # dedicated machine at 127.0.0.1, with HA bridging into it - flip this back
  # to 127.0.0.1 then.
  host: 192.0.2.230
  port: 1883
  # Left empty on purpose: credentials must not be committed. Set
  # HEATCTL_MQTT_USERNAME / HEATCTL_MQTT_PASSWORD in the environment
  # (systemd: EnvironmentFile=). On the target machine a local anonymous
  # listener may make both unnecessary.
  username: ""
  password: ""
  base_topic: heatctl
  ha_discovery: true
  ha_discovery_prefix: homeassistant
  # Indoor dew point, driving the cooling condensation limit (see safety
  # below). INTERIM source: Home Assistant's `sensor.system_dew_point_reference`
  # helper, the highest indoor dew point across the rooms that report humidity,
  # republished onto this topic. Empty disables supervision and leaves safety
  # on its static fallback, which is the correct degradation - do NOT point
  # this at an outdoor dew point, which is often higher and would forbid
  # cooling that is perfectly safe indoors.
  #
  # ⚠️ THE HELPER'S FOURTH PAIR IS *NOT* THE OUTDOOR STATION, however much its
  # name suggests it. `fineoffset_wh32_245` is the ARBEITSZIMMER sensor - this
  # very file uses it as that room's `room_temp_topic` - and it is the only
  # sensor on the OG. On 2026-07-31 it was removed from the helper's max() in
  # the belief that it was outdoor, which dropped the reference 17.1 -> 15.7 and
  # the condensation limit with it. That was wrong and was reverted the same
  # hour. Proof, hourly means from that night:
  #
  #   WH32-245   26.4 26.4 25.8 25.3 25.3 25.4 25.5 25.7   <- does not swing
  #   WH65B-210  22.1 18.9 17.4 17.3 19.5 20.9 22.4 24.2   <- genuinely outdoor
  #
  # A sensor that does not follow the diurnal swing is indoors. Check that
  # before concluding anything from a sensor's name.
  #
  # ARBEITSZIMMER IS NOW EXCLUDED FROM THE REFERENCE, DELIBERATELY (owner,
  # 2026-08-06). **This reverses the paragraph that used to stand here**, which
  # argued the opposite and was written after the 2026-07-31 removal was undone
  # as a mistake. Both the old text and the old removal were about the same
  # question and reached opposite answers, so read the dates before acting.
  #
  # What changed is not the physics but the hydraulics: the fan coil has a
  # CONDENSATE DRAIN, so condensation there is collected rather than damaging.
  # The room may therefore run below its own dew point, and including it in the
  # max() would hold the whole plant's supply ~3 K warmer to protect a surface
  # that is designed to get wet. Measured 2026-08-06: Arbeitszimmer's dew point
  # was 16.5 against 13.4-13.6 for the ground floor, so it would have set the
  # limit for every slab circuit in the house.
  #
  # WHAT IS STILL TRUE, and is the reason the old paragraph was persuasive:
  # that room is genuinely the most condensation-prone in the building - it is
  # on the OG, coupled to the Wohnzimmer by the open Luftraum so warm moist air
  # collects there, and it holds a cold surface in a moving airstream. The
  # exclusion is safe ONLY because of the drain. If the fan coil is ever fed
  # from a separate circuit, or the drain blocks, this decision must be revisited.
  dew_point_topic: "heatctl/env/dew_point"

  # OUTDOOR AIR for the slab-target feedforward (docs/DESIGN_ENERGY_DEMAND.md).
  # The weather station, NOT the heat pump's own ambient register: that sensor
  # is mounted on the unit and runs 1.8-2.1 K high through the afternoon
  # (measured 2026-08-06: 30.4 vs 28.6 at 16:00, 29.0 vs 26.9 at 18:00) with
  # a 45.6 degC excursion on 2026-08-04. `UA_ao * (T_set - AT) / UA_sa` lands
  # that error on the target at about half size, so it is the largest single
  # term in the whole computation. The register stays as the fallback for when
  # this broker is gone, and heatctl publishes which source it used.
  #
  # Straight off rtl_433, so occasional frames are garbled - one read 13.4 degC
  # while both HA entities and the heat pump agreed on ~27. Hence the median
  # below; a single bad frame would otherwise move the target ~7 K.
  # WH65B and WH24 are the same physical station decoded two ways and agree to
  # within 0.2 K; WH65B is the one HA derives its dew point from.
  outdoor_temp_topic: "rtl_433/74930c0d-rtl433/devices/Fineoffset-WH65B/210/temperature_C"
  outdoor_median_samples: 3

# --- Heat pump (PW58321) -------------------------------------------------
# heatctl is the SOLE Modbus master for this device. Not a preference: the
# unit documents a minimum 200 ms between transactions and two independent
# masters cannot honour that on each other's behalf - they demonstrably
# interfere. Home Assistant's modbus hub for this unit must stay disabled; HA
# gets everything from the MQTT topics heatctl publishes.
# Register map and the reasoning: docs/HEATPUMP.md.
heatpump:
  enabled: true
  host: 192.0.2.37             # Waveshare RS485->TCP gateway
  port: 4196
  unit: 1                      # fixed by the device
  timeout_s: 5.0
  poll_interval_s: 5.0         # status block, own task - NOT the 1 s valve loop
  config_poll_interval_s: 300  # re-read all 269 RW registers and diff them:
                               # settings can be changed at the unit's own
                               # control panel and we want to know when they are
  # WRITES WEAR FLASH. The manual states the unit flashes its memory chip on
  # every write and warns against doing it often, so: no-op writes are dropped
  # before they reach the bus, and this budget caps the rest. A loop that tried
  # to reconcile every cycle would destroy the controller, not just waste
  # bandwidth - the budget exists to make that fail loudly instead.
  allow_writes: true
  # WARNING THRESHOLD, NOT A GATE (owner, 2026-07-31). Going over this raises a
  # user-visible alarm - `binary_sensor.heatctl_hp_write_budget_exceeded`, a
  # `problem` class entity - and the write STILL HAPPENS. Flash wear is a soft
  # cost accumulating over years; a plant deviation heatctl cannot correct is a
  # hard cost happening now. Dropping writes silently traded the second for the
  # first, in the wrong direction and where nobody could see it.
  write_budget_per_hour: 30
  # The real gate, 10x up. At this rate nothing legitimate is happening - it is
  # a control loop that has lost its mind - so refusing is the lesser harm.
  # Reaching it also publishes hp/write_hard_limit_hit.
  write_hard_limit_per_hour: 300

# --- WAGO node inputs ----------------------------------------------------
# Process image: input registers 0-11 = 750-652 (RS485, unused),
# 12-27 = 4x 750-463 (16x PT1000, value = degC * 10, two's complement)
sensors:
  base_register: 12
  channels:
    - {index: 1,  name: rl_hk01, label: "Return circuit 1"}
    - {index: 2,  name: rl_hk02, label: "Return circuit 2"}
    - {index: 3,  name: rl_hk03, label: "Return circuit 3"}
    - {index: 4,  name: rl_hk04, label: "Return circuit 4"}
    - {index: 5,  name: rl_hk05, label: "Return circuit 5", enabled: false}
    - {index: 6,  name: rl_hk06, label: "Return circuit 6"}
    - {index: 7,  name: rl_hk07, label: "Return circuit 7"}
    - {index: 8,  name: rl_hk08, label: "Return circuit 8"}
    - {index: 9,  name: rl_hk09, label: "Return circuit 9"}
    - {index: 10, name: rl_hk10, label: "Return circuit 10"}
    - {index: 11, name: rl_hk11, label: "Return circuit 11"}
    # MANIFOLD CABINET AIR, three of them - NOT circuit returns (owner,
    # 2026-08-01: "I've fitted sensors for RL12 plus the two unused inputs
    # (15 and 16). All should be ambient cabinet temp."). Input 12 was
    # previously mislabelled "Return circuit 12" and disabled; 15/16 were
    # "Reserve".
    #
    # WHY THIS MATTERS RATHER THAN BEING COSMETIC. D-009 says a circuit with no
    # flow stops measuring its circuit and starts measuring this cabinet, and
    # `rl_gate.py` currently detects that with a TIMER (`settle_s`). Measured
    # against five months of pre-heatctl history (2025-10..2026-02), every
    # circuit collapsed from 4.6-9.7 K above cabinet air to within ~1 K of it
    # when flow stopped, and took 2-3 HOURS to recover afterwards - against a
    # `settle_s` of 300 s. A direct cabinet reading lets the gate test the
    # condition it actually cares about instead of a proxy for it.
    #
    # THREE of them, so the reference survives one failing and a median can
    # reject an outlier. They are not interchangeable with each other blindly:
    # on 2026-08-01 input 12 read 0.6 K above 15 and 16, which may be placement
    # (higher in the cabinet) or offset - do not assume they agree, check.
    - {index: 12, name: amb_manifold_12, label: "Manifold cabinet air 12"}
    - {index: 13, name: vl_total, label: "Supply total"}
    - {index: 14, name: rl_total, label: "Return total"}
    - {index: 15, name: amb_manifold_15, label: "Manifold cabinet air 15"}
    - {index: 16, name: amb_manifold_16, label: "Manifold cabinet air 16"}

# --- WAGO node outputs ---------------------------------------------------
# Holding registers 0-11 = 750-652, 12-19 = 2x 750-559 (0-10V, 0..32767)
valves:
  base_register: 12
  channels:
    # 16 analog outputs (4x 750-559, positions 7-10) at holding registers
    # 12-27 since 2026-07-27. AO index n -> holding register 11+n ->
    # M{7+(n-1)//4}Ch{(n-1)%4+1}, read back at 0x0200+11+n. Verified against
    # the coupler.
    #
    # MAPPING IS 1:1 WITH THE CIRCUIT NUMBER (owner, 2026-07-27): analog
    # output n drives circuit n, and input n is that same circuit's return
    # sensor. "Input 1, output 1: Gästebad. Etc."
    #
    # CORRECTED 2026-07-27. The previous 8-channel table was built around
    # "8 outputs for 10 active circuits" and so skipped the out-of-service
    # circuits, shifting everything after index 4: index 5 was named
    # valve_hk06, 6 was valve_hk07, 7 was valve_hk11, 8 was valve_spare. That
    # meant e.g. the Arbeitszimmer room PID - which has a live sensor and was
    # commanding real percentages - drove circuit 7's output. Harmless only
    # because no actuator is fitted on those channels yet.
    #
    # `fitted` says whether an ACTUATOR is physically on that circuit. It is
    # not cosmetic: an unfitted circuit is open pipe, so its return sensor is
    # always valid (heatctl/rl_gate.py) and it always passes flow (the demand
    # controller's flow proxy counts it as 100 %). Flip to true as each
    # actuator is installed - marking one fitted before it is will make
    # heatctl hold or flush a circuit that is in fact wide open.
    #
    # 2026-07-31: actuators fitted on 1-4 and 6-11 (owner). These flags were
    # flipped the same evening, BEFORE the wiring was verified, on an
    # asymmetry argument rather than on evidence - the two errors here are not
    # equally bad:
    #
    #   fitted: true  on a channel that is NOT really connected -> the flow
    #     proxy under-counts real flow (the circuit is open pipe anyway) and
    #     rl_gate distrusts a return sensor that was in fact trustworthy.
    #     Control quality is lost; nothing is endangered.
    #   fitted: false on a channel that IS connected -> enforce_flow_floor
    #     computes need = 40*10 - 100*8 = -400 and can never fire, so
    #     distribution may drive circuits to open_threshold_pct (5 %) and
    #     starve the exchanger into Er03; and rl_gate unconditionally trusts
    #     return sensors on circuits that can now sit shut (D-009 defect, on
    #     eight circuits at once).
    #
    # The second is dangerous in both directions, the first only wasteful, so
    # the safe default while wiring is UNVERIFIED is true. Verification is the
    # per-channel sweep in tools/commission_valves.py.
    - {index: 1,  name: valve_hk01, fitted: true}   # Gästebad
    - {index: 2,  name: valve_hk02, fitted: true}   # Wohnzimmer
    - {index: 3,  name: valve_hk03, fitted: true}   # Kinderzimmer Natalie
    - {index: 4,  name: valve_hk04, fitted: true}   # Kinderzimmer Naomi
    - {index: 5,  name: valve_hk05, fitted: false}  # Bad Handtuchhalter, reserve
    - {index: 6,  name: valve_hk06, fitted: true}   # Badezimmer
    - {index: 7,  name: valve_hk07, fitted: true}   # Elternschlafzimmer
    - {index: 8,  name: valve_hk08, fitted: true}   # Wohnzimmer
    - {index: 9,  name: valve_hk09, fitted: true}   # Wohnzimmer
    - {index: 10, name: valve_hk10, fitted: true}   # Wohnzimmer
    - {index: 11, name: valve_hk11, fitted: true}   # Arbeitszimmer
    - {index: 12, name: valve_hk12, fitted: false}  # out of service
    # Genuine spares - no circuit 13-16 exists.
    - {index: 13, name: valve_ao13, fitted: false}
    - {index: 14, name: valve_ao14, fitted: false}
    - {index: 15, name: valve_ao15, fitted: false}
    - {index: 16, name: valve_ao16, fitted: false}

# --- Rooms: the actual control unit -------------------------------------
# A room groups one or more floor circuits and optionally a room air
# temperature sensor published to MQTT. Control strategy:
#   - with room sensor: room air PID -> valve position for all circuits
#   - without (yet):    return-temperature PID per circuit
#
# Room air sensors: Shelly H&T per room remains the TARGET (the shellies/...
# topic below is the example format); none are installed yet. INTERIM source
# is the two surviving legacy wall units (Gaestebad and Wohnzimmer only -
# the rest were lost in the overvoltage event). See docs/HARDWARE.md; their
# addresses live in local notes outside this repository.
#
# circuit->room mapping below follows the legacy Controme database, which is
# authoritative: it drove this house for years. An earlier version of this
# file had circuits 7 and 10 transposed (7 as Wohnzimmer, 10 as
# Elternschlafzimmer) from recollection; corrected 2026-07-26. Circuit 11
# (Arbeitszimmer) is a recent addition and therefore absent from Controme.
# See the cross-check table in docs/HARDWARE.md.
rooms:
  - name: gaestebad
    label: "Gästebad"
    floor_area_m2: 3.43   # WC/Du
    circuits: [{sensor: rl_hk01, valve: valve_hk01}]
    # Legacy wall unit, bridged to MQTT by an HA automation (interim - that
    # data only exists over HTTP on the old Mini Server). Target is a Shelly
    # H&T publishing natively, e.g. shellies/shellyht-XXXX/sensor/temperature
    room_temp_topic: "roomtemp/gaestebad"
  - name: wohnzimmer
    label: "Wohnzimmer"
    floor_area_m2: 42.11   # Wohnen/Essen
    circuits:
      - {sensor: rl_hk02, valve: valve_hk02}
      # Assigned 2026-07-27: with 16 analog outputs every circuit has one, and
      # the mapping is 1:1 with the circuit number.
      - {sensor: rl_hk08, valve: valve_hk08}
      - {sensor: rl_hk09, valve: valve_hk09}
      - {sensor: rl_hk10, valve: valve_hk10}
    # Legacy wall unit, bridged to MQTT by an HA automation (interim).
    room_temp_topic: "roomtemp/wohnzimmer"
  - name: kind_natalie
    label: "Kinderzimmer Natalie"
    floor_area_m2: 16.33   # plan "Kind 1": W + S glazing, the room with TWO
                           # windows, which is how the occupant identifies it
    circuits: [{sensor: rl_hk03, valve: valve_hk03}]
    room_temp_topic: ""
  - name: kind_naomi
    label: "Kinderzimmer Naomi"
    floor_area_m2: 15.61   # plan "Kind 2": S glazing only, one window
    circuits: [{sensor: rl_hk04, valve: valve_hk04}]
    room_temp_topic: "roomtemp/kind_naomi"   # Shelly H&T G3, via the HA bridge
  - name: badezimmer
    label: "Badezimmer"
    floor_area_m2: 8.94   # Bad
    circuits: [{sensor: rl_hk06, valve: valve_hk06}]
    room_temp_topic: "roomtemp/badezimmer"   # Shelly H&T G3, via the HA bridge
  # rl_hk05 = Badezimmer Handtuchhalter, reserve, not installed
  - name: schlafzimmer
    label: "Elternschlafzimmer"
    floor_area_m2: 11.08   # Schlafen
    circuits: [{sensor: rl_hk07, valve: valve_hk07}]
    room_temp_topic: "roomtemp/schlafzimmer"   # Shelly H&T G3, via the HA bridge
  - name: arbeitszimmer
    label: "Arbeitszimmer"
    floor_area_m2: 31.20   # plan "Arbeit/Gaeste"
    # NOT A SLAB ROOM. It is on the OG and its emitter is a fan coil, so it has
    # neither the floor build-up nor the mass. Both matter: `c_slab_wh` is
    # 63.7 Wh/(m2 K) x 136.40 m2, and that 136.40 is the GROUND FLOOR slab -
    # this room is not in it. Assigning slab capacity here invented 1987 Wh/K
    # of storage, 24 % of the house total, in a room that has none.
    # The area is still carried: the room is real, loses heat through a real
    # envelope, and needs its UA share. Only the slab model is excluded.
    emitter: fan_coil
    circuits: [{sensor: rl_hk11, valve: valve_hk11}]
    # FineOffset WH32 via the rtl_433 bridge - a bare numeric payload on its
    # own topic, so no Home Assistant in the path for this room.
    room_temp_topic: "rtl_433/74930c0d-rtl433/devices/Fineoffset-WH32/245/temperature_C"

# --- Control -------------------------------------------------------------
control:
  mode: heating                # heating | cooling | off (overridable via MQTT)
  loop_interval_s: 1.0
  default_setpoint_heating_c: 21.0   # room temp if room sensor present,
  default_setpoint_cooling_c: 23.0   # otherwise interpreted as return temp target
  # 23.0 (was 24.0): at 24 the rooms sat below target and commanded 0 %, i.e.
  # no cooling at all. Only applies to rooms WITHOUT a wall-unit dial - for
  # Gaestebad and Wohnzimmer the dial overrides this within a minute.
  return_temp_setpoint_heating_c: 22.0
  return_temp_setpoint_cooling_c: 20.0
  # Where the per-circuit return target comes from:
  #   fixed          -> the two absolute values above
  #   system_return  -> track the mixed system return (sensor 14, rl_total)
  # system_return makes the inner loop a BALANCING controller: a circuit
  # returning warmer than the system average gets more flow in cooling (colder
  # -> more flow in heating), so distribution evens out. The heat pump owns the
  # absolute water temperature via its own return setpoint, so this loop only
  # decides distribution - which is heatctl's actual job until per-room air
  # sensors exist. A fixed absolute target is near-useless in cooling: the slab
  # return sits below any plausible target even with warm rooms (measured
  # 2026-07-26: returns 18.5-19.2 vs a 20.0 target commanded 0 % everywhere).
  return_setpoint_source: system_return
  system_return_sensor: rl_total
  # Applied in whichever direction INCREASES demand, so positive always means
  # "tend to open", in both modes. Needed because a pure system-return target
  # makes "all valves closed" a valid equilibrium: with no flow every circuit
  # equalises at slab temperature, error is zero everywhere, and a controller
  # starting with an empty integrator stays shut. See heatctl/main.py.
  system_return_bias_c: 0.0
  pid_room:   {kp: 25.0, ki: 0.005, kd: 0.0, out_min: 0.0, out_max: 100.0}
  pid_return: {kp: 8.0,  ki: 0.02,  kd: 0.0, out_min: 0.0, out_max: 100.0}

  # Valve distribution. The objective is EFFICIENCY, not pump protection:
  #   maximise overall flow -> minimise the leaving/return spread ->
  #   the water can sit closer to room temperature -> better COP
  # Throttling a valve is a cost, paid only to share energy between rooms that
  # need different amounts. So the whole set of demands is scaled such that the
  # most-demanding circuit is fully open, preserving the ratios between rooms
  # while the absolute energy delivered stays governed by water temperature.
  # See heatctl/distribution.py and docs/DESIGN.md 4.4.
  distribution:
    enabled: true
    # THE tuning knob, and a real engineering trade-off rather than a fudge
    # factor: the demand scale below which rooms stop being told apart.
    # Larger -> flatter distribution -> more flow, better COP, less per-room
    # discrimination. Smaller -> sharper distribution, less flow. It also
    # resolves the 0/0 at perfect equilibrium: with every demand at zero the
    # result is every valve fully open, which is the physically right answer
    # (nothing to distribute, so no reason to throttle) reached continuously.
    eps: 5.0
    # Normalisation couples the circuits - a change in the most-demanding room
    # rescales every other one - so the reference peak is slew-limited, in
    # percent of demand per 1 s cycle. Without it one room's transient would
    # re-throttle the whole house against multi-minute actuators.
    max_peak_step_per_cycle: 2.0
    # Actuator effective range (docs/DESIGN.md 4.1.2). IDENTITY until measured:
    # "normalise so the peak circuit is fully open" only means what it says
    # once full_open_pct is a measured number, and there is a deadband at the
    # bottom that probably mirrors one at the top. Needs the actuators fitted
    # plus a characterisation run - see docs/DESIGN.md 4.5.
    # MEASURED from the datasheet, not guessed (D-022). Moehlenhoff Alpha 5
    # APV 42505-00: 0-0.5 V is ignored to reject hum on long cables, so 5 %
    # of the 0-10 V range does nothing at all. Above that the drive is active.
    open_threshold_pct: 5.0
    # 100 is correct for a PHYSICAL reason, not merely the safe default: the
    # APV variant has valve-travel detection and auto-adapts its active
    # control-voltage range, regulating internally for maximum stroke minus
    # over-travel. The upper deadband is real and the device already
    # compensates for it - do not subtract it a second time.
    full_open_pct: 100.0

  # Load compensation: house demand -> water temperature setpoint. The third
  # level of the cascade, and the one that decides efficiency - water colder
  # than needed just makes the valves throttle it back, paying a COP penalty
  # and carrying condensation risk for the same room temperature.
  # 1 K every 30 min (owner, 2026-07-27): slow and integer because every write
  # wears the pump's flash and the slab has hours of thermal mass.
  # See heatctl/setpoint.py.
  # Layer 2's pre-conditioning delta: `active room target = dial + delta`.
  # The wall dial keeps owning what the occupant asked for; layer 2 only ever
  # shifts it, so the two never fight over one value.
  #
  # Signed and mode-independent. Negative aims cooler (pre-cool before a hot
  # afternoon), positive warmer (pre-charge before a storm). Deriving the
  # direction from plant mode instead would make "aim cooler while heating"
  # unexpressible, and that is a real case.
  #
  # There is NO bound on the delta itself, deliberately. `safety.clamp_setpoint`
  # bounds the RESULT, and that absolute limit is the real protection - a second
  # arbitrary number in front of it would just be one nobody derived. The
  # magnitude is not where the risk is either: a winter storm dropping the
  # outdoor temperature 20 K over six hours is 20 x 267 W/K x 6 h = 32 kWh,
  # which against 15.3 kWh/K of building capacity is only ~2.1 K of target
  # shift. The building's mass sets this quantity's scale, not the weather.
  #
  # Expiry is the whole safety story: stale means 0.0, i.e. exactly the dial.
  # That is why this needs no command-TTL machinery - a hung layer 2 degrades to
  # ordinary comfort control instead of steering the house indefinitely.
  setpoint_delta:
    max_age_s: 3600

  # Compressor frequency ceiling (R32, 0x00F1). SPREAD IS CAPACITY - Q = m*c*dT
  # with flow fixed by the pump - so this loop MAXIMISES spread subject to the
  # manifold supply staying clear of the condensation limit, rather than
  # minimising it.
  #
  # Measured 2026-07-30: uncapped at 79-80 Hz the spread was 4.5 K and the
  # supply hit 15.3 against a 16.0 limit - a breach, valves shut, nothing
  # delivered. Hand-capped to 45 Hz it ran 44-45 Hz, 1.4-2.5 K spread, 2.8 K of
  # margin - safe but leaving capacity unused on a 38 degC day. Neither fixed
  # value is right for long: the correct ceiling moves with the dew point.
  #
  # Asymmetric. Raising spends capacity that may not come back if it breaches;
  # lowering protects the slab. So raises are rate-limited and lowers are
  # immediate. Every write wears the unit's flash, hence minutes not seconds.
  capacity:
    enabled: true
    # Owner, 2026-07-31: "By measuring at the manifold with 0.1 degree
    # precision, and by controlling max compressor power much more fine grained
    # than the coarse step point, we have much better control that make the
    # 1.5K headroom we are currently seeing seem excessive." Correct on both
    # counts, and this should have moved when it was said.
    # ZERO, deliberately (owner, 2026-07-31: "Trip at 0, target 1K"). The
    # limit already IS the control target - dew point plus
    # safety.dew_point_margin_c - so aiming at it needs no second margin. This
    # was only ever buying separation from the guard, and the guard now trips
    # at the dew point itself rather than at the target.
    target_margin_c: 0.0
    deadband_c: 0.25
    # 5 Hz was ~0.37 K of supply movement per step at the measured ~0.074 K/Hz -
    # coarse enough that it was itself a reason to keep a wide margin. 2 Hz is
    # ~0.15 K, comfortably finer than the margin it has to respect.
    # PLANT GAIN: how far manifold supply moves per Hz of compressor ceiling.
    # The step is now `error / this`, so one write closes the error instead of
    # walking toward it in fixed increments (three writes in three seconds was
    # measured on 2026-07-31 with a fixed 2 Hz step).
    #
    # PROVENANCE: POOR. Inferred from 45 Hz -> ~2.0 K and 80 Hz -> 4.5 K spread
    # observations that were NOT a controlled step test - the condensation
    # limit was moving underneath them. A clean step test against a stable dew
    # point is the fix, and it belongs with the compressor-stop experiment.
    # Belongs in params.yaml once layer 1 reads it (D-031).
    supply_k_per_hz: 0.074
    # Dimensionless: what fraction of the error one move closes. Closing all of
    # it at once is unstable with transport lag. At 0.5 this reproduces the
    # hand-tuned 5 Hz step for the ~0.8 K errors actually seen - which is a
    # reassuring sign that the hand tuning had found roughly the right gain.
    loop_gain: 0.5
    step_min_hz: 1.0        # never write for less than this
    step_max_hz: 10.0       # nor lurch further than this on one estimate
    # Settle between raises. Was 600 s, which only made sense with a small
    # FIXED step; a proportional step closes the error in one move, so the only
    # thing to wait for is the plant (1-3 min). 2x lower_settle_s because
    # raising spends margin a breach would cost us.
    raise_interval_s: 120
    # Settle time between SUCCESSIVE lowering moves. The first is never
    # delayed. This is control, not wear management: the plant responds in
    # 1-3 min, so judging the error again after one second means acting on
    # your own un-responded move.
    lower_settle_s: 60
    min_hz: 30.0   # the device's own floor; 35 left 5 Hz of range unused
    max_hz: 90.0
    # Raising the ceiling only helps if the ceiling is what limits the machine.
    at_ceiling_hz: 3.0
    # R32 only binds in silent mode, and silent mode's own fan cap (D09,
    # 0x00F4) defaults to 60 against the ~800 RPM the condenser actually needs.
    # Refuse to touch the ceiling unless that has been raised - a frequency cap
    # with a throttled condenser fan is a high-pressure trip.
    fan_cap_min: 400

  water_setpoint:
    enabled: true
    interval_s: 1800        # 30 min - the COMFORT cadence, matched to the slab
    # The CAPACITY cadence, used while the house wants everything it can get.
    # The setpoint's effect on the machine is immediate and the water loop
    # settles in 1-3 min, same as the capacity loop; the hours-long constant
    # belongs to the house, not to the plant. Flash is not the constraint -
    # this is at most 30 writes/hour against a 30/hour budget only in the
    # pathological case, and the deviation band stops it hunting.
    # At least ~7x the capacity loop's settle times. Setting these EQUAL on
    # 2026-07-31 let the trim walk P04 19 -> 14 in ten minutes and outrun the
    # frequency ceiling that protects supply - a cascade needs the outer loop
    # several times slower than the inner, or it is two controllers racing.
    saturated_interval_s: 900
    step_c: 1.0
    saturated_pct: 85.0     # valves this open = not enough capacity
    idle_pct: 30.0          # valves this shut = water more aggressive than needed
    deviation_band_c: 0.3
    cooling_min_c: 14.0     # operating bounds, inside the register's 7-30
    cooling_max_c: 25.0
    heating_min_c: 20.0     # inside the register's 15-50
    heating_max_c: 40.0
    breach_jump_c: 6.0
    # CONSTRAINT MEMORY (2026-07-29). How far the cooling supply limit must
    # FALL before a setpoint the condensation guard already rejected is worth
    # attempting again.
    #
    # Without this the trim re-attempted the same rejected step every 30 min:
    # measured that day, 14 oscillations between 12:24 and 20:19 while the
    # house drifted from 0.32 K to 1.25 K off target, with the plant sitting
    # ~30 of every 36 minutes a full kelvin warmer than it could sustain. A
    # setpoint rejected at a given limit is infeasible FOR THAT LIMIT, so only
    # the constraint moving can make it succeed - never the clock.
    #
    # 0.5 K is half a trim step: small enough to explore promptly when the air
    # genuinely dries out, large enough that sensor noise on the dew point
    # cannot re-open the cycle by itself. Raising it makes the plant slower to
    # exploit a real improvement; lowering it toward the dew point's own noise
    # floor reintroduces the oscillation this exists to kill.
    constraint_retry_margin_c: 0.5

    # DYNAMIC COOLING FLOOR (2026-07-29). The setpoint targets RETURN water
    # while condensation is about the water reaching the slab, so the floor has
    # to be the condensation limit PLUS however far below the setpoint the
    # leaving water lands - the machine's measured delta-T. A static offset
    # above is now only the backstop for start-up, before any spread has been
    # measured; the live estimate takes over and can only ever tighten it.
    #
    # Why measured and not a constant: on this evening the spread went from
    # 5.8 K to 2.0 K within an hour on two register writes - F10 (pump delta-T
    # target 5 -> 2) and clearing powerful_mode, which took the compressor from
    # 85-89 Hz bursts to a steady 39-40 Hz. An earlier attempt to tune a
    # constant offset was withdrawn precisely because the quantity moves.
    #
    # The estimate is a DECAYING MAXIMUM, not an average: it feeds a safety
    # floor, so it must rise the instant the machine produces a wide spread and
    # relax only slowly. An average would sit mid-distribution and let half of
    # all excursions through. 0.995 per 5 s heat-pump poll is a ~10 min
    # relaxation time - long enough to cover a full compressor ramp, short
    # enough to exploit a genuine improvement within the hour.
    spread_decay: 0.995
    spread_min_c: 1.0         # never trust a spread below this
    spread_max_c: 8.0         # nor let a garbage reading drive the floor absurd

  # Source demand and minimum flow - ONE decision, see docs/DESIGN.md 4.3.
  # Aggregate per-ROOM deviation into a signed house demand (too cold ->
  # heating, too warm -> cooling) and engage the source only when that demand
  # is big enough that the resulting valve openings keep the pump above its
  # minimum flow. Below that, run nothing and let the rooms coast.
  source_demand:
    # ON since 2026-07-27. With the corrected model this is a RECONCILER, not
    # a controller: it holds the unit powered, and only powers it down on an
    # explicit `off`. That restores what the HA "circulation pump request"
    # automation used to do, which nothing has done since that automation was
    # disabled - the unit has simply been running on whatever its own flash
    # said.
    # Powering a heat pump down is a measure of LAST RESORT. The unit
    # regulates itself: it starts and stops its own compressor and varies
    # power from the leaving/return spread. heatctl modulates by WATER
    # TEMPERATURE (control.water_setpoint) and trims per room with the valves.
    enabled: true
    # heatctl commands the pump's mode register (0x0004) to follow the plant
    # mode, every cycle, as a no-op when they already agree. auto_mode is the
    # further step: the HOUSE AVERAGE picks that plant mode rather than a
    # person. ON since 2026-07-27 (owner).
    # Guarded by mode_deadband_c and mode_dwell_s below - the average must sit
    # more than 1 K past the band for a full hour before the plant flips. That
    # is deliberately sluggish: switching the whole plant is expensive and
    # slow to undo, and only three of seven rooms have an air sensor, so the
    # "house average" is an average of three.
    # DISABLED 2026-07-29 (owner). Automatic changeover decided the season from
    # indoor deviation alone, and that question cannot be answered without a
    # forecast: a cool house at dawn means "well pre-cooled" in July and "needs
    # heat" in October, and the deviation is identical.
    #
    # Measured failure the same morning: at 05:56, before a day that reached
    # 31 degC, it flipped the plant cooling -> heating on a house average of
    # +1.10 K held for exactly one hour and rewrote the heat pump's mode
    # register. That overnight cooling was ~16 kWh of stored capacity - most of
    # the pre-charge the next day needed - and heating it away would have cost
    # an afternoon of fighting an 8 h slab.
    #
    # Two fixes were tried and withdrawn, both because they invented a constant
    # to make one incident come out right: an outdoor-temperature threshold
    # (outdoor was 10.5 degC at the moment of the flip, colder than autumn
    # mornings when heating is correct, so no instantaneous value separates the
    # cases) and a recent-maximum threshold. See BACKLOG.md.
    #
    # Re-enable only once layer 2's forecast can gate it. Holding the mode a
    # human chose is always safe; guessing it from indoor temperature is not.
    #
    # RE-ENABLED 2026-08-19 (owner), and the condition above is NOT met - the
    # forecast exists in layer 2 but `_pick_mode` still reads indoor deviation
    # alone. Recorded as a deliberate exception, not a resolution.
    #
    # What changed is the season, not the mechanism. The house had been 1-2 K
    # BELOW setpoint for 46 h (deviation +1.5 to +2.1 K since 08-17 12:00)
    # while the plant went on cooling, rooms at 21.2-22.3 against 23.0-23.5.
    # The July failure was the mirror image - flipping to heating on a cool
    # dawn before a 31 degC day - and the guard against repeating it is the
    # weather, not the code: the six-day forecast is 22-26 degC highs on
    # 12-18 degC nights, so a wrong flip costs a few hours, not 16 kWh of
    # pre-charge. Expect churn near the boundary; mode_deadband_c and
    # mode_dwell_s are what damp it.
    #
    # THE REAL DEFECT IS NOT HERE. auto_mode being off is why nothing acted,
    # but the over-cooling itself came from the capacity loop resuming the
    # compressor on condensation margin alone - it never asks whether the
    # house wants cooling - and the resume path then lowering the setpoint
    # BELOW the demand-derived value to defeat the unit's 2 K restart dead
    # zone. See BACKLOG "The plant cooled a house that was 1 K too cold".
    auto_mode: true
    # Flow floor as MEAN opening across all water-carrying circuits, counting
    # unactuated ones as 100 % (they are open pipe). 40 % is the owner's
    # measured figure - below it the system runs into trouble and eventually
    # the pump's own Er03 water-flow failsafe. NOTE this is a constraint on how
    # far heatctl may THROTTLE - a reason to hold valves open - and never a
    # reason to stop the source.
    #
    # The 55 needs re-deriving against the balanced manifold - on the 2026-08-09
    # evidence it sits ABOVE the saturation point, so this floor may be
    # commanding into dead range. Measurement and open action in
    # docs/FLOW_CHARACTERISATION.md.
    # Flow floor, as MEAN valve opening. 40 is the owner's estimate, and the
    # datasheet happens to agree: the BLP08P1V1MR32 wants 0.16-0.40 l/s, and
    # 0.16/0.40 is exactly 40 %. Do not read that as confirmation - the two
    # agree only if (a) flow is linear in mean opening and (b) all-valves-open
    # actually reaches the unit's 0.40 l/s. Neither is measured.
    # (b) is the real risk: if this system's loops mean the pump tops out at,
    # say, 0.30 l/s, then Er03 lies at 53 % of achievable flow and a 40 % floor
    # is too low. Er03 was observed instantly with everything but circuit 11
    # shut (owner, 2026-07-28), so the trip is real and unforgiving.
    # Replace this with a flow-based limit once flow is measured - see BACKLOG.
    #
    # RAISED 40 -> 55 on 2026-08-01, and the paragraph above called it: Er03
    # tripped repeatedly with the mean at 38.9 %, so 40 was NOT below the trip
    # point, it was essentially ON it. Every heat-pump reset re-faulted within
    # minutes because heatctl immediately throttled back to ~39 %.
    #
    # 55 is a MARGIN, not a measurement - treat it as provisional. Two things
    # found the same day say the underlying quantity is wrong, not just the
    # value:
    #   * The proportional valves have very low authority. Measured at the
    #     manifold flow indicators, an 18 % command still passes 1.5-2.0 l/min
    #     against a per-circuit maximum above 3 l/min - over half the flow at
    #     under a fifth of the command. So mean-commanded-percent is not
    #     proportional to flow in even a rough sense.
    #   * Consequently total flow is governed mostly by how many circuits are
    #     near-SHUT, not by the mean. A mean-based floor is the wrong shape for
    #     the failure it guards against, and can be satisfied while individual
    #     circuits are starved.
    # The flow-based limit in BACKLOG is the fix; until then this is a blunt
    # guard chosen to keep the plant running, and it binds continuously.
    min_open_pct: 55.0
    engage_deviation_c: 0.3 # how far off target before the source is worth it
    mode_deadband_c: 1.0    # PLANT-level only - rooms keep one target each.
                            # Without it the plant flaps around the average.
    mode_dwell_s: 3600      # and the average must persist this long
    min_on_s: 600           # anti-short-cycle. The compressor already cycles
    min_off_s: 600          # ~10 min on / ~9 min off unaided.

  # When is a circuit's return temperature worth believing?
  # The RL sensors sit on the return pipes AT THE MANIFOLD. With no flow a
  # sensor stops measuring its circuit and drifts toward the manifold
  # cabinet's ambient, i.e. roughly the header/system water temperature -
  # which, when the target IS the system return, reads as "error zero, nothing
  # to do". A closed circuit thus manufactures its own evidence to stay
  # closed: silent lock-out. Only affects circuits with `fitted: true`; open
  # pipe always flows. See heatctl/rl_gate.py and docs/DESIGN.md section 4.
  rl_gating:
    enabled: true
    min_opening_pct: 15.0   # PROVISIONAL - the Alpha 5 deadband is not yet
                            # measured (docs/HARDWARE.md). Below this we
                            # assume no meaningful flow.
    settle_s: 300           # valve stroke PLUS transport time through the
                            # loop - water must actually arrive at the sensor
    flush_interval_s: 3600  # a held-closed circuit is re-opened this often
    flush_pct: 100.0        # to take one honest reading

safety:
  # Hard limits - layer 2 may only set setpoints WITHIN these bounds
  setpoint_min_c: 15.0
  setpoint_max_c: 28.0
  vl_max_heating_c: 45.0       # screed protection: close valves on hot supply
  # off. TREAT WITH SUSPICION: it arrived undocumented in the initial commit
  # and it is not actually conservative - a 26 degC room at 60 % RH has a dew
  # point of 17.6 degC, above this value. It looks like a safe floor and is
  # not one.
  # Cooling needs a dew point to be safe at all: condensation is the one limit
  # that cannot be bounded without measuring the air. So no fresh reading ->
  # no cooling, rather than falling back on the number above. This also
  # matters most in exactly the case where the HA-side condensation automation
  # cannot help: if the dew point is missing BECAUSE Home Assistant died, then
  # its source-side pump shutdown died with it and this is the only protection
  # left. Set false only for a deployment with no dew-point source at all.
  # Live dew-point supervision (mqtt.dew_point_topic). The condensation limit
  # is not physically a constant: it is the dew point of the indoor air. With
  # a fresh reading the limit becomes dew_point + margin, which cuts BOTH
  # ways - it permits colder supply when the air is dry (measured 2026-07-27:
  # a 12.7 degC dew point against the 16.0 static limit was shutting circuits
  # in no danger at all) and forbids supply the static value would have
  # allowed when it is humid.
  # EMPIRICAL - matches the margin the HA loop has run at without
  # condensation. It is not a screed-gradient correction: the floor build-up
  # is vapour-permeable, so condensation happens throughout the slab and
  # directly on the pipe wall, which is essentially at water temperature.
  # Supply temperature is therefore very nearly the surface that matters, with
  # no hidden reserve behind it. The margin covers measurement error and the
  # spread of indoor dew point between rooms. And note condensation inside the
  # slab is INVISIBLE - nothing will prompt anyone to notice it.
  # REDUCED 2.0 -> 1.0 on 2026-07-29 (owner). The 2 K was sized for the HEAT
  # PUMP's leaving-water register, which is scaled 0.5 and therefore quantised
  # to 0.5 K. But the guard that actually closes valves reads `vl_total` - a
  # PT1000 on the manifold via the 750-463, decoded as degC*10, so **0.1 K**.
  # The margin was covering a coarseness the binding sensor does not have.
  #
  # Worth 1 K of supply headroom across all ten circuits, which at a textbook
  # 7 W/(m^2 K) is roughly 1 kW of extra slab capacity - and it lowers the
  # setpoint floor by a full step, which is exactly the pre-charge that was
  # otherwise unreachable the night before a 37 degC day.
  #
  # NOTE the trim's breach branch (setpoint.py) still reads the heat pump's
  # 0.5 K register, so it effectively keeps ~0.5 K less margin than this. That
  # is acceptable because it is a SOFT action - it raises the water setpoint -
  # while the hard valve guard runs on the precise sensor.
  #
  # ⚠️ THE BINDING UNCERTAINTY IS NOW THE DEW POINT ITSELF, not the
  # temperature. It is computed from room humidity, and a capacitive RH sensor
  # at +-2-3 % RH is worth roughly +-0.5-0.9 K of dew point at 24 degC - which
  # is most of this margin. Two things keep that tolerable: the value used is
  # the MAXIMUM across every instrumented room, which is conservative by
  # construction, and the guard reacts to measured supply rather than trusting
  # a prediction. Do not reduce this further without knowing the humidity
  # sensors' actual accuracy - condensation inside the slab is invisible, which
  # is the whole reason this margin exists.
  dew_point_margin_c: 1.0
  # Hysteresis on the condensation guard, and it applies to REOPENING ONLY -
  # the trip stays instantaneous, because closing is the protective direction
  # (D-023). Sized from measurement, not taste: supply and the dew point are
  # each quantised to 0.1 K and dither independently, so anything below 0.2
  # leaves the LSB flapping. 0.3 buys roughly 30-75 s of extra closed time at
  # the observed recovery rate of ~0.1 K per 10-25 s, which together with the
  # natural recovery keeps a closure beyond the actuator's 150 s stroke.
  # RAISING this costs cooling: the plant runs with valves shut while the
  # supply is already safe. LOWERING it below 0.2 re-opens the defect.
  dew_point_release_margin_c: 0.3
  # How long supply must sit below the dew point CONTINUOUSLY before the valve
  # backstop closes circuits. Added 2026-08-01 on the owner's call: *"it's not
  # like a minute or three below dew point causes immediate harm, if it is a
  # rare event."* Condensation is a rate process; three minutes deposits
  # nothing that matters, while the instant trip it replaced fired on a single
  # 0.1 K quantisation tick and starved the pump into a LATCHED Er03 needing a
  # person at the unit. Er03 appeared three times on 2026-08-01.
  #
  # It is not an arbitrary delay - it makes the guard the last stage of a
  # cascade. The capacity loop cuts frequency within a cycle and stops the
  # compressor at its floor, so if supply is still under the dew point after
  # this long, the source-side protection has demonstrably failed. That case is
  # real: the heat pump was unreachable for 8 minutes that afternoon with
  # supply 0.1 K off the dew point, and nothing else could have stopped it.
  #
  # 0 restores the pre-2026-08-01 instant trip. Do NOT raise this to "fix"
  # nuisance closures without checking what is driving supply down - the
  # capacity loop is what should be answering that.
  undertemp_dwell_s: 180.0
  # Older than this reads as ABSENT. The comment here used to say "fall back to
  # the static value"; there is no static value any more (removed 2026-07-31)
  # and absent now means heatctl refuses to make cold water at all - a
  # source-side stop, not a valve action. See safety.py.
  dew_point_max_age_s: 900
  frost_protect_c: 6.0         # below this return temp: force valve open
  sensor_fault_raw: [0x05DC, 0xFED4]  # wire-break / short-circuit saturation
  stale_data_timeout_s: 15     # no fresh input data -> failsafe
  # FAIL OPEN (changed 2026-07-26, was 50). Applies when knowledge is lost:
  # sensor fault, stale data, crashed controller. The heat pump's own
  # controller holds a return-water setpoint, so an unsupervised open circuit
  # still receives water at a sane temperature - all that is lost is efficient
  # distribution and per-room control, not safety.
  # NOT a blanket policy: screed overtemp still drives valves CLOSED, because
  # there the heat is already in the water in the slab and closing removes it.
  # Below-dew-point cooling no longer does (D-035, 2026-08-19) - closing valves
  # cannot reach the compressor that is making the cold water, it only starves
  # the unit into a latching Er03. Condensation is a source-side matter now.
  # See the policy docstring in heatctl/safety.py before changing either.
  # Hardware limit: the actuators are NC, so loss of signal/power closes them
  # whatever we command - this covers software failure, not power loss.
  failsafe_valve_pct: 100

logging:
  level: INFO
  state_db: /data/heatctl.sqlite   # history for system identification
  log_every_n_cycles: 60
  # Rolling buffer, not the archive. The archive is InfluxDB via Home
  # Assistant - verified receiving full-resolution heatctl data 2026-07-27.
  # This file is the layer-1-independent fallback for when HA is the thing
  # that broke, so it only has to cover a gap; unbounded it would be about a
  # GB a year on an appliance nobody watches. Events are kept 10x longer than
  # samples: they are tiny, and they answer "why did it do that".
  retention_days: 14

# --- Layer 2 (optimizer) -------------------------------------------------
# Read by optimizer/main.py, ignored entirely by the control core. Layer 2 is
# a separate process and allowed to fail; nothing here can affect layer 1.
optimizer:
  interval_s: 60
  # House air target the load forecast is computed against. The answer scales
  # with it - a 1 K higher target removes roughly H x 1 K = 0.27 kW from every
  # hour of the day.
  target_air_c: 24.0
  # What the plant can actually deliver, and this is the SOURCE limit, not the
  # emitter limit. Slab 3.4-4.8 kW plus fan coil 4.2 kW is 7.6-9.0 kW of
  # emitter against a heat pump good for ~5.7 kW at 11 degC supply, so the
  # machine binds first (docs/HARDWARE.md). Using the slab figure alone
  # overstates the storage deficit by about half - measured 2026-07-29: 31.4
  # kWh against the slab versus 22.3 kWh against the source, for the same day.
  delivery_ceiling_w: 5700.0

  # PRE-CONDITIONING LEAD HORIZON, hours. Excess inside it gets full weight in
  # the setpoint delta; beyond it the weight tapers with the fast mode.
  #
  # Omit this and the horizon is 2*tau_fast = 11.2 h at the identified
  # parameters, which is the distance needed to FILL the mass. That is the
  # right number if the only question is "how long before I need the charge
  # must I start", and it is what shipped.
  #
  # 24 h is set here because that is not the only question. The charging
  # opportunity and the demand are one diurnal cycle apart: this house has
  # spare capacity at night and none in the afternoon, and an 11.2 h horizon
  # cannot see tomorrow's peak from tonight. Measured 2026-08-02 22:00 -
  # tomorrow forecast 7 h over ceiling wanting 0.43 K of pre-charge, its 15:00
  # peak 17 h out and weighted 0.36, delta -0.20 K. Nothing was malfunctioning;
  # the horizon simply did not reach.
  #
  # This is a TRIAL value, and the honest state of it is that the two arguments
  # are not decidable from the parameters - it turns on whether spare capacity
  # persists into the morning, which nothing here measures. Widening costs
  # comfort and standing loss if the short-horizon argument is right. Revert to
  # omitting the key to get the shipped behaviour back.
  lead_horizon_h: 24.0
