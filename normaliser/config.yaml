# Sensor-topic normaliser. See normaliser/main.py for why this exists.
#
# Same rule as heatctl's config.yaml: the copy that runs is the one MOUNTED on
# the device (/media/sdcard/docker-root/normaliser/config.yaml on the PFC200).
# This file is the reference and the review surface; a deploy ships code, never
# config.

mqtt:
  # The plant broker, plaintext on the container network. Credentials come from
  # the environment (NORMALISER_MQTT_USERNAME / _PASSWORD) so they are never
  # committed - see docs/PFC200.local.md.
  host: mqtt-broker
  port: 1883
  username: ""
  password: ""

# Where the normalised values go. Bridged to Home Assistant as part of
# `sensors/#`, so HA sees every room whether or not it still owns the device.
out_prefix: sensors/room

# HOW LONG A VALUE MAY BE SERVED TO A NEW SUBSCRIBER, in seconds, enforced by
# the broker as an MQTT 5 message-expiry interval.
#
# THIS IS NOW ONLY THE FLOOR, and only what a room gets before its device has
# reported a `wakeup_period` - see the learned windows below, which supersede
# it per room. It stays equal to heatctl's `control.room_temp_max_age_s`
# because the two are the same judgement ("older than this is not a measurement
# any more") and the plant should not hold two opinions about it; they enforce
# it independently on purpose (see the module docstring), but must not disagree
# about the number.
#
# 900 s came from the mains device: `wakeup_period: 600`, 360 s observed
# between connects. The learned window reproduces it exactly at wake_factor
# 1.5, which is why it is still a sensible floor rather than an accident.
ttl_s: 900

# --- freshness windows, learned from the devices -----------------------------
# `ttl_s` above is only the FLOOR now. Each room's real window is derived from
# what its own device reports as `wakeup_period` in `status/sys`, because the
# same Shelly H&T model says 600 s on mains and 7200 s on battery - a twelve-
# fold difference that no single number can serve. Note this is the WORST CASE
# and not the cadence: the 0.5 K delta reports sooner whenever the room moves.
# The window has to assume the worst case, so that is what is used. The derived value is
# published on `sensors/room/<room>/max_age_s` for heatctl to adopt.
#
# 1.5 covers jitter and NOT a missed wake, deliberately: the period is the
# device's guarantee, so silence past it means something is wrong and should
# show as stale. It also turns the mains device's 600 s into exactly the 900 s
# that was hand-chosen for it, which is a reassuring coincidence rather than a
# derivation.
wake_factor: 1.5

# The backstop. A device reporting an absurd period - misconfigured, or a
# payload we misread - must not be able to talk the plant into believing a
# measurement for a day. 4 h.
ttl_max_s: 14400

# Which topic reports each room's wake period. Explicit, like everything else
# here: `bad` is the device, `badezimmer` is the room, and neither is inferred
# from the other.
wake_topics:
  wohnzimmer: "sensors/shellies/wohnzimmer/status/sys"
  badezimmer: "sensors/shellies/bad/status/sys"
  gaestebad: "sensors/shellies/gaestebad/status/sys"

# --- sources ----------------------------------------------------------------
# Explicit, one entry per topic per field. Rooms are never inferred from a
# topic segment that happens to look like a room name.
#
#   topic     what to subscribe
#   room      heatctl's room name, exactly
#   field     temperature_c | humidity_pct  (these carry default bands)
#   json_key  omit for a bare number; name the field for a JSON payload
#   min/max   override the plausibility band; required for any other field
#
# ROOMS MIGRATE ONE AT A TIME. A room appears here once its Shelly publishes to
# this broker, and heatctl's `room_temp_topic` is repointed at the normalised
# topic separately - two steps, so the raw and normalised values can be
# compared on a live room before anything depends on the new one.
sources:
  - topic: "sensors/shellies/wohnzimmer/status/temperature:0"
    room: wohnzimmer
    field: temperature_c
    json_key: tC
  - topic: "sensors/shellies/wohnzimmer/status/humidity:0"
    room: wohnzimmer
    field: humidity_pct
    json_key: rh

  # BADEZIMMER. The device's topic base is `bad`, the heatctl room is
  # `badezimmer` - mapped explicitly here, never inferred.
  #
  # ON BATTERY, so `wakeup_period` is 7200 s against Wohnzimmer's 600 s on
  # mains - the guaranteed worst case, not the observed rate. Measured
  # 2026-08-22: eight temperature reports in five hours, worst gap 112 min,
  # which is the 0.5 K delta firing between wakes. That is far outside `ttl_s`, so this room will show as expired
  # much of the day - accepted deliberately, because its Controme sensor is
  # DEAD (two messages in eleven hours) and an hourly real reading beats a
  # permanent house average. The humidity matters more than the temperature:
  # it is the bathroom, it is what actually drives the house dew point, and
  # until now the local computation could not see it at all.
  - topic: "sensors/shellies/bad/status/temperature:0"
    room: badezimmer
    field: temperature_c
    json_key: tC
  - topic: "sensors/shellies/bad/status/humidity:0"
    room: badezimmer
    field: humidity_pct
    json_key: rh

  # GAESTEBAD. heatctl now reads this (2026-08-22), and with it the LAST room
  # that reached the plant through a Controme Raumcontroller. The objection
  # recorded here before - that the Controme path published ~620 times a day
  # against this device's ~7, so switching traded a two-minute cadence for a
  # two-hour one - was answered by the second option in it: the freshness
  # window is now sized per room from the device's own `wakeup_period`, so the
  # slow cadence is declared rather than mistaken for staleness.
  - topic: "sensors/shellies/gaestebad/status/temperature:0"
    room: gaestebad
    field: temperature_c
    json_key: tC
  - topic: "sensors/shellies/gaestebad/status/humidity:0"
    room: gaestebad
    field: humidity_pct
    json_key: rh

  # Still to come, as each room's Shelly is installed and pointed here:
  # kind_natalie, kind_naomi, schlafzimmer, arbeitszimmer. Those rooms reach
  # heatctl over the Home Assistant bridge (`roomtemp/#`) or rtl_433, which are
  # not sleeping sources, so they do not need this yet - see BACKLOG.
