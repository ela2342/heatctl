# Layer 2 model parameters.
#
# PROVENANCE MATTERS MORE THAN THE NUMBERS HERE. Every value carries where it
# came from and how well it is known, because the whole point of running a
# filter is to improve the badly-known ones from data - and you cannot tell
# which those are from the values alone. Confidence levels follow
# docs/DESIGN.md 6.1.2.
#
# Site-specific figures are derived in docs/BUILDING.local.md (git-excluded).
# What appears here is the thermal reduction only, which carries no site
# identity, so this file is safe in the repository.

building:
  # Air -> outdoor. Fabric+bridges 148.83 W/K (fair; 18 % of it is a Bbl 2
  # default) plus ventilation 118.40 W/K at n = 0.7 /h (POOR - assumed, never
  # measured; a blower-door test is on BACKLOG). Their sum, 267.2 W/K, is
  # independently corroborated by the measured whole-house H of ~267 W/K,
  # which is a genuinely good sign for the total even though the SPLIT
  # between fabric and ventilation remains unverified. That split does not
  # matter for a 2-state model; it will matter for per-room work.
  ua_ao:
    value: 267.2
    unit: W/K
    sigma: 20.0
    kind: prior
    note: >
      Fabric+bridges 148.83 plus ventilation 118.40 at n=0.7/h. KIND CORRECTED
      2026-08-01 from `measured` to `prior`: the note used to say the total is
      "corroborated by a measured whole-house H of ~267 W/K", but the owner
      confirms 267 comes straight from the BUILDING PERMIT CALCULATION. A design
      calculation is not a measurement and cannot corroborate itself.
      The evidence points LOWER. D-028's winter fit gives H = 216 +- 18 W/K, and
      the 2026-08-01 moisture work independently implies n ~ 0.39-0.58 rather
      than 0.7; at n = 0.40 the ventilation term falls to 67.7 and the total to
      216.5 W/K - agreeing with D-028 to better than 1 W/K. Three routes
      converge on ~216, none of them on 267.
      Not changed to 216 here because the moisture-derived n rests on a PRIOR
      for household moisture production, not a measurement. See BACKLOG.
      The split does not matter to a 2-state model and will matter per room.

  # Room air -> water. IDENTIFIED FROM OPERATING DATA 2026-07-30, replacing a
  # guess of 1000 that was above a measured upper bound.
  #
  # Measured at 16:53 with the plant in steady operation: manifold dT 2.10 K at
  # 1.24 m3/h gives 3020 W, against a room mean of 25.37 degC and a mean water
  # temperature of 19.20 - so 3020 / 6.17 = 490 W/K.
  #
  # No flow-split assumption is needed for this figure, which is why it is the
  # one used. The 2-state model has no separate coil node, so ALL heat leaving
  # the rooms into water passes through this conductance by construction. (For
  # reference, stripping the coil by assuming it takes a proportional share of
  # flow puts the slab alone at 256-355 W/K, but that rests on a flow split
  # nobody has measured.)
  #
  # The old 1000 came from EN 1264's 10.8 W/(m2 K) surface coefficient over
  # 136.40 m2, de-rated by a third. That reasoning was doubly wrong: it used the
  # floor SURFACE coefficient where the model needs the path from the thermal
  # mass, and the de-rating was invented. It sat above a directly measurable
  # ceiling for as long as nobody measured it.
  #
  # Confidence: fair, roughly +-20 %. The dominant uncertainties are the assumed
  # flow (+-10 % systematic) and a room mean taken over 3 of 7 rooms.
  # ⚠️ RESCALED 2026-07-31 when the flow was corrected 1.24 -> 1.44 m3/h.
  # This was identified as Q/(T_air - T_water) with Q = m_dot_c * dT, so it is
  # PERFECTLY CORRELATED with the flow: 490 * (1.44/1.24) = 568.
  #
  # **That correlation is load-bearing and must not be lost.** In
  # `k = ua_sa / (m_dot_c - ua_sa/2)` the flow error cancels exactly, so the
  # constraint-optimal setpoint P04_opt is INVARIANT to the worst-known
  # parameter in this file. `Q_max`, which carries a bare m_dot_c, scales with
  # it linearly (418 -> 486 W per K). Propagating flow and ua_sa as independent
  # would overstate the uncertainty on one and understate it on the other.
  # NOT STORED AS A VALUE. `derived.ua_sa()` computes it from the measurement
  # below and the flow, so the flow error propagates structurally instead of
  # being annotated and forgotten (D-032).
  ua_sa_identification:
    manifold_dt_k:
      value: 2.10
      unit: K
      sigma: 0.14        # two 0.1 K-quantised PT1000s, class B, differenced
      kind: measured
      note: >
        Manifold return minus supply, 2026-07-31 16:53, plant in steady
        operation.
    room_mean_c:
      value: 25.37
      unit: degC
      sigma: 0.8
      kind: measured
      note: >
        Mean over the three instrumented rooms of seven. The sigma is
        dominated by that coverage, not by sensor error.
    water_mean_c:
      value: 19.20
      unit: degC
      sigma: 0.15
      kind: measured

  # Slab -> ground. From the as-built floor build-up.
  ua_sg:
    value: 29.0
    unit: W/K
    sigma: 4.0
    kind: specified
    note: From the as-built floor build-up.

  # Everything that is not the slab: air, furniture, internal partitions,
  # plaster. Whole-building C is predicted at ~15,300 Wh/K and measured at
  # 15,700-18,300 Wh/K; taking the predicted total less the slab gives this.
  # The partition contribution inside it (~2,000 Wh/K) carries +-20 % on its
  # own because the internal wall run is a geometric estimate, not a take-off.
  c_air_wh:
    value: 6600.0
    unit: Wh/K
    sigma: 1300.0
    kind: identified
    derived_from: [c_slab_wh]
    note: >
      Predicted whole-building C (~15,300 Wh/K) less the slab. Measured C spans
      15,700-18,300, hence the wide sigma. The partition term inside it
      (~2,000 Wh/K) is a geometric estimate carrying +-20 % on its own.

  # Floor slab, from as-built layers: 63.7 Wh/(m^2 K) x 136.40 m^2.
  c_slab_wh:
    value: 8691.0
    unit: Wh/K
    sigma: 700.0
    kind: specified
    note: As-built layers, 63.7 Wh/(m2 K) x 136.40 m2.

  # Split of solar gain between air and floor. Through large windows most of
  # the beam lands on the floor, so the majority goes to the slab. This is a
  # guess with no measurement behind it and is a prime candidate for the
  # identification ladder - it is also the parameter most likely to be
  # responsible for a daytime innovation bias.
  f_sol:
    value: 0.30
    unit: "-"
    sigma: 0.15
    bounds: [0.0, 1.0]
    kind: prior
    note: >
      A GUESS, and the sigma expresses ignorance rather than measurement error.
      Prime candidate for the identification ladder and the most likely cause
      of a daytime innovation bias.

  # Internal gains: people, appliances, standing losses. Derived from the
  # household-gain decomposition (see BACKLOG.md) at roughly +-10 W/K
  # equivalent. Treated as a constant here; it plainly is not one, and the
  # diurnal pattern is another candidate for the innovation to expose.
  q_internal_w:
    value: 350.0
    unit: W
    sigma: 120.0
    kind: identified
    note: >
      From the household-gain decomposition. Fair on the DAILY MEAN and plainly
      not constant through the day; the diurnal pattern is another thing the
      innovation should expose.

  # Undisturbed ground temperature under the slab. Annual mean air temperature
  # is the standard first approximation; it drifts seasonally by a couple of K
  # under a heated slab and is treated as a constant here because ua_sg is
  # small enough that the resulting error is well under the noise.
  t_ground:
    value: 10.0
    unit: degC
    sigma: 2.0
    kind: prior
    note: >
      Annual mean air temperature, the standard first approximation. Drifts a
      couple of K seasonally under a heated slab; ua_sg is small enough that
      the resulting error stays under the noise.

# Per-facade glazing, from the certificate's own area build-ups (which sum
# exactly to its stated per-orientation totals) and the measured true
# azimuths. Window areas and orientations describe a building's shape, not its
# location - the coordinates that would locate it stay in the environment and
# in docs/BUILDING.local.md, never here.
#
# THE AZIMUTHS ARE MEASURED, NOT THE DRAWING LABELS. The building is rotated
# 16.3 deg from north, so the elevation named "Ost" actually faces 106.3 deg
# (ESE) and catches sun appreciably earlier than a true-east wall would. Using
# the nominal 0/90/180/270 would put the morning gain peak in the wrong hour,
# which for a slab-charging planner is worse than getting the magnitude wrong.
#
# `aperture_m2` = brutto x 0.70 frame x 0.90 shading x 0.50 g-value.
# The building survey's "effective collector area" also folds in a flat 0.9
# for non-perpendicular incidence; that constant is DELIBERATELY EXCLUDED here
# because solar.py computes the real incidence angle hourly. Re-applying it
# would double-count and under-predict gain by about a tenth.
solar:
  albedo: 0.20              # -   grass/gravel; fresh snow reaches ~0.8
  facades:
    - {name: N, azimuth_deg:  16.3, aperture_m2: 1.550}   # brutto  4.92 m^2
    - {name: E, azimuth_deg: 106.3, aperture_m2: 6.785}   # brutto 21.54 m^2
    - {name: S, azimuth_deg: 196.3, aperture_m2: 6.180}   # brutto 19.62 m^2
    - {name: W, azimuth_deg: 286.3, aperture_m2: 1.588}   # brutto  5.04 m^2

  # Per-room split of the SAME glazing, keyed by the room names in
  # heatctl's config.yaml. Apertures use the identical convention to the
  # facades above - brutto x 0.70 frame x 0.90 shading x 0.50 g - and
  # deliberately NOT the survey's extra 0.9 non-perpendicular factor, which
  # solar.py supersedes by computing incidence hourly. Survey A_eff figures
  # are therefore aperture x 0.9, not aperture.
  #
  # Window-to-room assignment is owner-confirmed (2026-07-29) and was checked
  # arithmetically: the assigned ground-floor windows sum exactly to the
  # per-facade totals minus the upper floor. That closure is re-checked by
  # tests/test_optimizer_solar.py, so a typo here fails the suite rather than
  # quietly moving heat between rooms.
  #
  # CAVEAT ON THE 0.90 SHADING FACTOR: nothing at this site has been surveyed
  # for shading. The number comes from the energy certificate's methodology and
  # survives because it reproduces the certificate's own effective areas. It is
  # a flat annual constant applied to an hourly model, and it is most wrong on
  # the east facade in the morning - overhangs and reveals shade HIGH sun,
  # while the east gain arrives at 7-27 deg elevation with nothing in its way.
  # Removing it entirely moves Schlafen's peak 788 -> 876 W, which is small
  # against a floor that can remove ~253 W. Worth measuring, not worth
  # blocking on.
  rooms:
    # 48 % of the house's glazing on 20 % of its floor, split east and south so
    # it collects from dawn to mid-afternoon. The room that ran away 2026-07-28.
    wohnzimmer:    {E: 4.470, S: 3.314}
    # One 2.08 x 2.38 east window, and the whole day's gain lands 07:00-11:00.
    schlafzimmer:  {E: 1.559}
    kind_naomi:    {S: 0.794}
    kind_natalie:  {S: 0.794}   # plus an unassigned share of the west EG
    arbeitszimmer: {N: 0.756, E: 0.756, S: 1.280, W: 0.605}
    # UNASSIGNED, and left out on purpose so the gap stays visible: the north
    # EG 1.20x2.10 (0.794) and the west EG group (0.983), which belong to some
    # mix of kind_natalie, gaestebad and the utility room. 1.8 of 14.5 m^2
    # effective, on the two facades with the least gain. `per_room_w` omits
    # rooms it has no data for rather than reporting a confident 0.0.

# Hydronics. THE FLOW RATE IS LOAD-BEARING: it converts every measured
# manifold delta-T into watts, so it sets the scale of every energy figure this
# project quotes. Until 2026-07-31 it lived only in prose - four mentions in
# BACKLOG.md, two in DECISIONS.md, two in BUILDING.local.md and one inside a
# COMMENT in this file - while underpinning all of them. D-031 exists because
# of it.
hydronics:
  # The heat pump's spec sheet REQUIRES 0.16-0.40 l/s (0.58-1.44 m3/h) through
  # its plate exchanger. That is the machine's permitted range, not this
  # installation's delivered flow. `dc_pump_speed` telemetry sits at 90-100 %,
  # which puts us near the top of the band: 1.2-1.44 m3/h (docs/HEATPUMP.md).
  #
  # CORRECTED within the hour (owner): the spec band IS what the installation
  # delivers at minimum and maximum PUMP SPEED - that is why it is a spread,
  # not a tolerance. The pump is internal to the unit, so `dc_pump_speed`
  # (0x802A, %) maps onto this band directly. Measured 2026-07-31: **100 %**,
  # i.e. the top of the band, 1.44 m3/h. Earlier work used 1.24 from a COP-map
  # derivation and understated every energy figure by 16 %.
  #
  # ⚠️ THIS SHOULD TRACK `dc_pump_speed` RATHER THAN BE A CONSTANT. It is
  # pinned only because F7 (DC Pump Max Speed) is at its 100 % default and the
  # pump is running there. The moment pump modulation is enabled this becomes
  # wrong, and per D-031 the flow should then be computed from the live
  # register against `flow_min_m3_h`/`flow_max_m3_h` rather than stored.
  #
  # Confidence: fair at the current pinned speed - the endpoints are specified
  # and the speed is telemetered. It degrades to POOR as soon as the pump
  # modulates. Nothing measures actual flow; the MULTICAL 403 retires this.
  # **The MULTICAL 403 on the shopping list is what retires this**, and it is
  # the single measurement that would most improve every number in this file.
  #
  # ⚠️ Do NOT store the derived `m_dot_c` beside this (D-031). Compute it:
  #     m_dot_c [W/K] = density * specific_heat * flow_m3_h / 3600
  #   = 998 * 4183 * 1.44 / 3600 = 1670 W/K
  # so that re-measuring the flow moves every dependent figure by itself.
  flow_m3_h:
    value: 1.44
    unit: m3/h
    bounds: [0.58, 1.44]
    sigma: 0.07
    kind: specified
    derived_from: [dc_pump_speed]
    note: >
      Bounds ARE the installation's delivery at minimum and maximum pump speed
      - the pump is internal to the unit - so dc_pump_speed (0x802A, %) maps
      onto them directly.

      **THE MAPPING IS PROPORTIONAL, and the spec pins it exactly:**
      0.58 / 1.44 = 40.3 %, and F8 "DC Pump Min Speed" defaults to 40 %. Both
      endpoints agree with `flow = flow_max * speed/100`. So flow is fully
      determined by telemetry and was never a constant.

      This `value` is therefore only the fallback used when the pump speed is
      unknown; `derived.flow_m3_h(params, pump_pct)` is the real answer. Within
      two hours of this file first claiming the pump was "pinned at 100 %" it
      was observed at 70 % - i.e. 1.01 m3/h, not 1.44 - which would have
      overstated delivered power by 40 % had anything trusted the stored value.
  water_density_kg_m3:
    value: 998.0
    unit: kg/m3
    sigma: 1.0
    kind: specified
    note: Water at the ~20 degC this circuit runs at in cooling.
  water_specific_heat_j_kg_k:
    value: 4183.0
    unit: J/(kg K)
    sigma: 3.0
    kind: specified

# Filter tuning. These are NOT physical parameters - they encode how much we
# distrust the model against how much we distrust the sensors.
filter:
  # Process noise, per state, as a standard deviation in K per hour. The slab
  # gets much more than the air because its driving input Q_heat is derived
  # from an assumed pump curve rather than measured (no heat meter yet), so
  # the slab equation is the one carrying the unmodelled error. Revisit both
  # when the MULTICAL 403 is fitted.
  q_air_k_per_h: 0.15
  q_slab_k_per_h: 0.40

  # Measurement noise on room air temperature. The Controme wall units report
  # to 0.1 K, but they are wall-mounted at one point in a room and read the
  # wall as much as the air, so the useful figure is far worse than the
  # resolution. This is a stand-in until the Shelly H&T units land.
  r_air_k: 0.50

  # Initial state uncertainty. Air starts well known (we measure it); the slab
  # starts badly known, because nothing measures it directly and its initial
  # value is a guess from the air temperature.
  p0_air_k: 1.0
  p0_slab_k: 5.0

# Turning the heat pump's electrical power estimate into thermal watts.
# THIS IS THE MODEL'S WEAKEST INPUT and the reason the slab process noise is
# set as high as it is. There is no heat meter yet, so delivered heat is
# inferred from a calibrated current-to-power fit and a flat assumed COP,
# which ignores that COP varies strongly with supply temperature and outdoor
# conditions. docs/DESIGN.md 6.1.1 calls flow "a model prerequisite, not an
# accounting nicety"; the MULTICAL 403 on the shopping list is what retires
# this block.
heat_input:
  assumed_cop:
    value: 3.35
    unit: "-"
    sigma: 1.0
    kind: prior
    note: >
      A flat seasonal average standing in for a COP that varies strongly with
      supply temperature and outdoor conditions. THE MODEL'S WEAKEST INPUT and
      the reason q_slab_k_per_h is set as high as it is. The MULTICAL 403
      retires it.
  # Below this electrical power the pump is treated as off rather than
  # modulating, so standby draw is not integrated into the slab as heat.
  standby_w: 250.0

# Forecast bias correction for the local river valley. Derived 2026-07-29 from
# 3,388 paired winter hours; see BACKLOG.md for the derivation, the
# out-of-sample validation, and the 1 K quantisation caveat on the source
# data. These are SITE CONSTANTS - they describe this valley and must never be
# imported from elsewhere.
#
#   dT = -a * (1 - cloud_cover/100) * exp(-wind_10m / w0)      [night only]
#
weather:
  bias_a_k: 5.0         # K       amplitude at zero cloud, zero wind
  bias_w0_kmh: 8.0      # km/h    wind scale that kills the inversion
  # Refuse to apply a correction larger than this. A refit that goes wrong
  # should degrade to the raw forecast, not steer the plant with nonsense.
  bias_clamp_k: 5.0
  latitude: null        # set in the deployed config; site-identifying
  longitude: null
